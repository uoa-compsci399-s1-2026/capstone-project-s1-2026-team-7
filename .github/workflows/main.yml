name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:
  run-and-test:
    runs-on: ubuntu-latest

    env:
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      NEXT_PUBLIC_SERVER_URL: ${{ secrets.NEXT_PUBLIC_SERVER_URL }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Determine Git branch and Neon branch
        shell: bash
        run: |
          GIT_BRANCH="${{ github.head_ref }}"

          case "$GIT_BRANCH" in
            main)
              NEON_BRANCH="production"
              ;;
            james|james-*)
              NEON_BRANCH="james"
              ;;
            kelvin|kelvin-*)
              NEON_BRANCH="kelvin"
              ;;
            ayush|ayush-*)
              NEON_BRANCH="ayush"
              ;;
            carl|carl-*)
              NEON_BRANCH="carl"
              ;;
            johnathan|johnathan-*)
              NEON_BRANCH="johnathan"
              ;;
            rahul|rahul-*)
              NEON_BRANCH="rahul"
              ;;
            *)
              NEON_BRANCH="production"
              ;;
          esac

          echo "GIT_BRANCH=$GIT_BRANCH" >> "$GITHUB_ENV"
          echo "NEON_BRANCH=$NEON_BRANCH" >> "$GITHUB_ENV"

      - name: Set Neon project context
        run: npx neonctl set-context --project-id "$NEON_PROJECT_ID"

      - name: Fetch DATABASE_URL from Neon
        shell: bash
        run: |
          DATABASE_URL="$(npx neonctl connection-string "$NEON_BRANCH")"
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Next.js Build
        run: npm run build

      - name: Run tests
        run: npm run test